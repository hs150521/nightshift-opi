# Nightshift AP dnsmasq - serves only ap0 (192.168.51.0/24)
# Provides DHCP and DNS for ESP32 sensors on the AP subnet.

interface=ap0
bind-interfaces
except-interface=lo
no-resolv
no-hosts
dhcp-range=192.168.51.10,192.168.51.100,255.255.255.0,12h
dhcp-option=3,192.168.51.1
dhcp-option=6,192.168.51.1
dhcp-authoritative
listen-address=192.168.51.1
port=53
