# Nightshift Wi-Fi AP configuration
# Virtual AP on ap0 (sharing phy with wlan0).
# ESP32 pressure sensors connect to this AP.
# wlan0 must associate on 2.4 GHz before this AP starts.  The start script
# writes a runtime copy and replaces channel= with wlan0's current channel,
# because brcmfmac supports managed+AP only on one shared channel.

ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

interface=ap0
driver=nl80211
ssid=stillwork
hw_mode=g
channel=1
country_code=CN
ieee80211n=1
wmm_enabled=1
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP
wpa_passphrase=CHANGE_ME_BEFORE_DEPLOY
ignore_broadcast_ssid=0
macaddr_acl=0
