# Nightshift Wi-Fi Access Point configuration
# ESP32 pressure sensors connect to this AP on the OPI.
# Interface: wlan0 (built-in wireless on Orange Pi 3B)

interface=wlan0
driver=nl80211
ssid=nightshift-ap
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40]
macaddr_acl=0
auth_algs=1
wpa=2
wpa_passphrase=nightshift2024
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
country_code=US
