# Mosquitto MQTT broker for Nightshift OPI.
# Requires per_listener_settings for listener-specific auth.

per_listener_settings true

# Listener 1: loopback only — local backend (nightshift-opi service)
listener 1883 127.0.0.1
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# Wired LAN listener - upper computer on 192.168.50.0/24
listener 1884 192.168.50.1
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# Listener 2: Wi-Fi AP (stillwork) — ESP32-S3 sensors on 192.168.51.0/24
listener 1884 192.168.51.1
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

log_dest syslog
log_type error
log_type warning
log_type notice

max_queued_messages 1000
max_inflight_messages 20
