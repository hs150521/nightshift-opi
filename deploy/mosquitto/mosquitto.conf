# Nightshift Mosquitto MQTT broker configuration.
# Listens on localhost and the AP interface for ESP32 clients.

listener 1883 0.0.0.0
protocol mqtt

allow_anonymous true

persistence true
persistence_location /var/lib/mosquitto/

log_dest syslog
log_type error
log_type warning
log_type notice

max_queued_messages 1000
max_inflight_messages 20
