[Unit]
Wants=nightshift-ap.service
After=nightshift-ap.service

[Service]
# Mosquitto binds an address-specific listener to 192.168.51.1.  Wait until
# nightshift-ap has created ap0 and assigned that address before binding.
ExecStartPre=/bin/sh -c 'until ip -4 addr show dev ap0 2>/dev/null | grep -q "inet 192.168.51.1/24"; do sleep 1; done'
TimeoutStartSec=120
Restart=on-failure
RestartSec=10
