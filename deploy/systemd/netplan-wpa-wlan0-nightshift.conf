[Service]
# The BCM4345 vendor kernel is unstable when wpa_supplicant creates a
# P2P-device while wlan0 and hostapd share one phy. Nightshift does not use
# Wi-Fi Direct, so disable only that control interface before supplicant
# reads netplan's generated configuration.
ExecStartPre=/bin/sh -c 'grep -qxF "p2p_disabled=1" /run/netplan/wpa-wlan0.conf || sed -i "1i p2p_disabled=1" /run/netplan/wpa-wlan0.conf'
