# Keep the BCM4345 firmware from roaming around wpa_supplicant's pinned
# 2.4 GHz BSSID. Disable legacy P2P management as this device only needs
# one managed interface plus one hostapd AP interface. wpa_supplicant's
# P2P-device creation is disabled by the matching systemd drop-in.
#
options brcmfmac roamoff=1 p2pon=0
